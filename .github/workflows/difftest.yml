name: difftest

# The milestone-6 cron lane: differential fuzzing of darkwing against the
# pinned DuckDB CLI, plus a native fuzz run of the public Parse API. The
# pin is a tagged release, so the CLI comes from its immutable release
# asset (duckdbsrc.ReleaseURL); the version check stays as a guard against
# a pin advanced without updating that URL.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  difftest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download the pinned DuckDB CLI
        run: |
          url=$(sed -n 's/.*ReleaseURL = "\(.*\)"/\1/p' internal/duckdbsrc/duckdbsrc.go)
          curl -fsSL -o duckdb_cli-linux-amd64.zip "$url"
          unzip -o -q duckdb_cli-linux-amd64.zip
          ./duckdb --version
      - name: Check the CLI against the pin
        id: pin
        run: |
          pin=$(sed -n 's/.*PinnedVersion = "\(.*\)"/\1/p' internal/duckdbsrc/duckdbsrc.go)
          version=$(./duckdb --version)
          if echo "$version" | grep -qF "$pin"; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
            echo "CLI is $version, pin is $pin - skipping until ReleaseURL matches the pin"
          fi
      - name: Differential fuzzing vs the pinned CLI
        if: steps.pin.outputs.matches == 'true'
        run: DARKWING_DUCKDB=$PWD/duckdb go run ./cmd/difftest -seed $(date +%s) -duration 20m
      - name: Native fuzzing of Parse
        run: go test ./parser -run '^$' -fuzz FuzzParse -fuzztime 10m
